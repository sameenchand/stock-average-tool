<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Profit/Loss Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Profit / Loss Calculator</h1>
        <div class="nav-buttons">
            <a href="/" class="nav-button">Average</a>
            <a href="/profit-loss" class="nav-button active">Profit / Loss</a>
            <a href="/dca" class="nav-button">DCA</a>
        </div>

        <div class="input-type-selector">
            <label class="radio-option">
                <input type="radio" name="input_type" value="price_quantity" checked>
                <span>Price &amp; Quantity</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="input_type" value="percentage_investment">
                <span>% Change &amp; Investment</span>
            </label>
        </div>

        <div class="input-sections">
            <div id="price-quantity-section" class="input-section">
                <div class="input-group">
                    <label for="buy_price">Buy Price</label>
                    <input type="number" id="buy_price" name="buy_price" placeholder="e.g. 52.30" step="0.01" min="0">
                </div>
                <div class="input-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" placeholder="e.g. 100" min="0">
                </div>
                <div class="input-group">
                    <label for="current_price">Current Price</label>
                    <input type="number" id="current_price" name="current_price" placeholder="e.g. 65.00" step="0.01" min="0">
                </div>
            </div>

            <div id="percentage-investment-section" class="input-section" style="display:none">
                <div class="input-group">
                    <label for="investment_amount">Investment Amount</label>
                    <input type="number" id="investment_amount" name="investment_amount" placeholder="e.g. 10000" step="0.01" min="0">
                </div>
                <div class="input-group">
                    <label for="percentage_change">Percentage Change (%)</label>
                    <input type="number" id="percentage_change" name="percentage_change" placeholder="e.g. 15 for gain, -10 for loss" step="0.01">
                </div>
            </div>
        </div>

        <div class="result" id="result-section" style="display:none">
            <h2>Results</h2>

            <div id="pq-summary" class="summary-grid" style="display:none">
                <div class="summary-item">
                    <span class="label">Buy Price</span>
                    <span class="value" id="res-buy-price">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Quantity</span>
                    <span class="value" id="res-quantity">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Current Price</span>
                    <span class="value" id="res-current-price">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Total Investment</span>
                    <span class="value" id="res-total-investment">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Current Value</span>
                    <span class="value" id="res-current-value">-</span>
                </div>
            </div>

            <div id="pct-summary" class="summary-grid" style="display:none">
                <div class="summary-item">
                    <span class="label">Investment Amount</span>
                    <span class="value" id="res-investment-amount">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Percentage Change</span>
                    <span class="value" id="res-pct-change">-</span>
                </div>
                <div class="summary-item">
                    <span class="label">Current Value</span>
                    <span class="value" id="res-pct-current-value">-</span>
                </div>
            </div>

            <div class="profit-loss-section">
                <div class="profit-loss-grid">
                    <div class="profit-loss-item" id="res-pl-item">
                        <span class="label">Net Profit / Loss</span>
                        <span class="value" id="res-net-pl">-</span>
                    </div>
                    <div class="profit-loss-item" id="res-roi-item">
                        <span class="label">ROI</span>
                        <span class="value" id="res-roi">-</span>
                    </div>
                </div>
                <div class="visual-indicator">
                    <div class="progress-bar">
                        <div class="progress-fill" id="res-progress-fill" style="width:50%"></div>
                    </div>
                    <div class="progress-labels">
                        <span>-100%</span>
                        <span>0%</span>
                        <span>+100%</span>
                    </div>
                </div>
            </div>

            <div id="target-price-section" class="target-price-card" style="display:none">
                <h3>Target Price</h3>
                <div class="target-price-row">
                    <label for="target-roi">To reach</label>
                    <input type="number" id="target-roi" placeholder="e.g. 20" step="0.01">
                    <span>% ROI, stock needs to reach:</span>
                    <span id="target-price-result" class="target-price-value"></span>
                </div>
            </div>

            <div class="result-actions">
                <button type="button" class="copy-btn" id="pl-copy-btn">Copy Results</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
