<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>DCA Calculator</title>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle">Dark</button>
        <h1>DCA Calculator</h1>
        <div class="nav-buttons">
            <a href="/" class="nav-button">Average Calculator</a>
            <a href="/profit-loss" class="nav-button">Profit/Loss Calculator</a>
            <a href="/dca" class="nav-button active">DCA Calculator</a>
        </div>

        <p class="subtitle">How many shares do you need to buy to reach your target average price?</p>

        <div id="dca-inputs" class="input-section">
            <div class="input-group">
                <label for="dca-current-qty">Shares Currently Held:</label>
                <input type="number" id="dca-current-qty" placeholder="e.g. 100" min="0">
            </div>
            <div class="input-group">
                <label for="dca-current-avg">Current Average Price:</label>
                <input type="number" id="dca-current-avg" placeholder="e.g. 80.00" step="0.01" min="0">
            </div>
            <div class="input-group">
                <label for="dca-new-price">New Buy Price:</label>
                <input type="number" id="dca-new-price" placeholder="e.g. 60.00" step="0.01" min="0">
            </div>
            <div class="input-group">
                <label for="dca-target-avg">Target Average Price:</label>
                <input type="number" id="dca-target-avg" placeholder="e.g. 70.00" step="0.01" min="0">
            </div>
        </div>

        <div class="result" id="dca-result" style="display:none">
            <h2>Results:</h2>

            <div id="dca-error" class="dca-error" style="display:none"></div>

            <div id="dca-success" style="display:none">
                <div class="summary-grid">
                    <div class="summary-item">
                        <span class="label">Shares to Buy:</span>
                        <span class="value" id="dca-shares-needed">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Additional Cost:</span>
                        <span class="value" id="dca-additional-cost">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">New Total Shares:</span>
                        <span class="value" id="dca-new-total-shares">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">New Total Investment:</span>
                        <span class="value" id="dca-new-total-investment">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Achieved Average:</span>
                        <span class="value" id="dca-achieved-avg">-</span>
                    </div>
                </div>
                <p class="dca-note" id="dca-fractional-note" style="display:none"></p>
                <div class="result-actions">
                    <button type="button" class="copy-btn" id="dca-copy-btn">Copy Results</button>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
